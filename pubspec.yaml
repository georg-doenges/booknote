name: booknote
description: "Booknote - Lesenotizen per Sprache erfassen"
publish_to: 'none'

# +N (build number) bei jedem Gerät-Build hochzählen: sonst behandeln manche
# Android-Geräte ein `adb install -r` als Neuinstallation und löschen App-Daten.
version: 0.1.0+18

environment:
  sdk: ^3.13.2

# Alle Pakete laufen auf Android UND iOS (siehe PROJECT.md, Abschnitt 3a).
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Stufe 1 – Storage (lokal, SQLite)
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # IDs (UUID v4, geräteübergreifend eindeutig – Vorbereitung auf Sync)
  uuid: ^4.5.1

  # Audio-Aufnahme + Whisper-HTTP
  record: ^6.1.2
  http: ^1.5.0

  # API-Key sicher speichern
  flutter_secure_storage: ^9.2.4

  # Einfache App-Einstellungen (Theme-Modus etc.), plattformneutral
  shared_preferences: ^2.3.2

  # Markdown-Export über Share-Sheet
  share_plus: ^12.0.1

  # Bibliotheksdatei zum Abgleich auswählen (Geräte-Sync)
  file_picker: ^8.1.4

  # Cover-Bilder zuverlässig laden + auf Platte cachen (auch offline)
  cached_network_image: ^3.4.1

  # Spürbares haptisches Signal beim Aufnehmen (Flutters HapticFeedback bleibt
  # auf manchen Geräten unbemerkt); plattformneutral (Android/iOS)
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # SQLite auf dem Desktop für Tests (Vertragstest der SQLite-Repositories)
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
