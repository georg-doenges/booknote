name: booknote
description: "Booknote - Lesenotizen per Sprache erfassen"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

# Alle Pakete laufen auf Android UND iOS (siehe PROJECT.md, Abschnitt 3a).
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Stufe 1 – Storage (lokal, SQLite)
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # IDs (UUID v4, geräteübergreifend eindeutig – Vorbereitung auf Sync)
  uuid: ^4.5.1

  # Audio-Aufnahme + Whisper-HTTP
  record: ^6.1.2
  http: ^1.5.0

  # API-Key sicher speichern
  flutter_secure_storage: ^9.2.4

  # Markdown-Export über Share-Sheet
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
