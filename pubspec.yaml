name: booknote
description: "Booknote - Lesenotizen per Sprache erfassen"
publish_to: 'none'

# +N (build number) bei jedem Gerät-Build hochzählen: sonst behandeln manche
# Android-Geräte ein `adb install -r` als Neuinstallation und löschen App-Daten.
version: 0.1.0+26

environment:
  sdk: ^3.13.2

# Alle Pakete laufen auf Android UND iOS (siehe PROJECT.md, Abschnitt 3a).
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Stufe 1 – Storage (lokal, SQLite)
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # IDs (UUID v4, geräteübergreifend eindeutig – Vorbereitung auf Sync)
  uuid: ^4.5.1

  # Audio-Aufnahme + Whisper-HTTP
  record: ^6.1.2
  http: ^1.5.0

  # API-Key sicher speichern
  flutter_secure_storage: ^9.2.4

  # Einfache App-Einstellungen (Theme-Modus etc.), plattformneutral
  shared_preferences: ^2.3.2

  # Markdown-Export über Share-Sheet
  share_plus: ^12.0.1

  # Bibliotheksdatei zum Abgleich auswählen (Geräte-Sync)
  file_picker: ^8.1.4

  # Cover-Bilder zuverlässig laden + auf Platte cachen (auch offline)
  cached_network_image: ^3.4.1

  # Spürbares haptisches Signal beim Aufnehmen (Flutters HapticFeedback bleibt
  # auf manchen Geräten unbemerkt); plattformneutral (Android/iOS)
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # SQLite auf dem Desktop für Tests (Vertragstest der SQLite-Repositories)
  sqflite_common_ffi: ^2.3.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Die Farbschemata sind bewusst kein App-Asset: sie liegen im Repo unter
  # themes/ und werden über den Katalog in der App geladen (siehe THEMES.md).
  #
  # Tinos (Google, SIL Open Font License 1.1, Lizenztext in assets/fonts/) –
  # metrisch mit Times New Roman kompatibel. Bisher nur vom "Old Library"-Theme
  # genutzt (`font`-Feld in themes/old_library.json). Schriften müssen im APK
  # stecken, ein Theme kann keine mitbringen.
  fonts:
    - family: Tinos
      fonts:
        - asset: assets/fonts/Tinos-Regular.ttf
        - asset: assets/fonts/Tinos-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tinos-Italic.ttf
          style: italic
        - asset: assets/fonts/Tinos-BoldItalic.ttf
          weight: 700
          style: italic

# App-Icon (Nutzer-Entwurf, siehe assets/icon/source.png). icon_legacy.png ist
# das volle Motiv (Rahmen inklusive) für iOS/Play Store/alte Android-Launcher;
# icon_foreground.png ist dasselbe Motiv ohne Rahmen, neu zentriert, für den
# adaptiven Android-Launcher (der maskiert selbst in Kreis/Squircle/…). Beide
# sind auf das braune "System"-Farbschema umgefärbt (kein Custom-Theme aktiv);
# "Blue Gold" und "Old Library" tragen ihr eigenes, passend umgefärbtes
# Logo direkt in der Theme-Datei (siehe THEMES.md), das App-Icon bleibt davon
# unberührt – Android kann das Icon nicht aus der Ferne pro Theme umschalten.
# `dart run flutter_launcher_icons` neu ausführen, falls sich eine der Dateien
# ändert. Diese Dateien sind kein App-Asset (siehe oben) – nur Build-Input.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_legacy.png"
  adaptive_icon_background: "#2E2018"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
